[versions]
kotlin                 = "2.3.21"
agp                     = "8.7.0"
android-minSdk          = "24"
android-compileSdk      = "35"
vanniktechMavenPublish  = "0.34.0"
ktlint                  = "12.1.2"
detekt                  = "1.23.7"
dokka                   = "2.0.0"
kover                   = "0.9.1"
skie                    = "0.10.14"
kotlinxSerialization    = "1.9.0"
kotlinxCoroutines       = "1.10.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# TODO: add this module's own dependencies here (e.g. ktor-client-*, other engine/transport
# libraries) — kept out of this base template since they vary module to module. See
# kiit-httprpc/kiit-rpc-kotlin/gradle/libs.versions.toml for an example (Ktor client + per-target
# engine artifacts).

[plugins]
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm",         version.ref = "kotlin" }
kotlinMultiplatform     = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidLibrary          = { id = "com.android.library",              version.ref = "agp"    }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish",     version.ref = "vanniktechMavenPublish" }
ktlint                  = { id = "org.jlleitschuh.gradle.ktlint",    version.ref = "ktlint"  }
detekt                  = { id = "io.gitlab.arturbosch.detekt",      version.ref = "detekt"  }
dokka                   = { id = "org.jetbrains.dokka",              version.ref = "dokka"   }
kover                   = { id = "org.jetbrains.kotlinx.kover",      version.ref = "kover"   }
skie                    = { id = "co.touchlab.skie",                 version.ref = "skie"    }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
